name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # Secrets aren't available to pull requests from forks, so only review branches in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # One of these two secrets must be set (repo Settings → Secrets and variables → Actions).
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. This repo holds Claude Code skills for Solutions Architects
            (claude-code/), an installer (install.sh), a README and a setup guide
            (ACCESS-AND-SETUP.md). Read README.md first for how it fits together.

            Check, in this order:

            1. Privacy (most important). The repo is PUBLIC. Flag anything that names or
               identifies a real customer, company, colleague or person; any customer or internal
               link; account, opportunity or record IDs; real email addresses; tokens or secrets.
               Examples must be made up (Acme, Alex, KEY-123). Also check the commit messages.
            2. Correctness of the skills and scripts: instructions that contradict each other,
               steps that would fail, wrong commands or flags, {{PLACEHOLDERS}} in the skills that
               install.sh doesn't fill in (and installer questions the docs don't mention), and
               anything that could make a skill read a credential file or guess customer links.
            3. README and guide: if the change affects what users do or see (new behaviour,
               installer questions, commands, credentials, file locations), say exactly which part
               of README.md or ACCESS-AND-SETUP.md is now out of date and what it should say.
               Also flag unclear or wrong instructions in changed docs.

            Leave inline comments on specific lines with
            mcp__github_inline_comment__create_inline_comment, then post one summary comment
            with `gh pr comment` that lists each finding by area (Privacy, Correctness, Docs),
            most important first. If there are no findings, say so in one line. Be concise and
            only report real problems; don't restate what the PR does.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
